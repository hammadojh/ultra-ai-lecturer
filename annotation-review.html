<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultra · Annotation review</title><link rel="stylesheet" href="playback.css"><style>.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:24px}.review-card{background:white;border:1px solid #d8dfef;border-radius:14px;padding:20px}.review-slide{position:relative}.review-slide img{width:100%;display:block}.review-slide svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.annotation-editor{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.annotation-editor input{width:70px}.annotation-editor label{font-size:12px}.voice-overall{display:grid;gap:10px;padding:18px;margin:0 0 24px;background:#eaf0ff;border:1px solid #cfdaff;border-radius:12px}.local-progress{font-size:13px;color:#536788;margin:10px 0}.view-toggle{display:flex;gap:4px}.view-toggle [aria-pressed=true]{background:#2855dc;color:white}.review-grid.rows-view{display:block}.rows-view .review-card{margin-bottom:12px}.slide-row-summary{cursor:pointer;font-size:17px;font-weight:600;padding:6px 0}.rows-view .slide-row-content{padding-top:16px;display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1fr);gap:20px}.rows-view .slide-row-content>.review-slide{align-self:start;position:sticky;top:100px}.rows-view .slide-row-content>.clip-editors{min-width:0}@media(max-width:750px){.rows-view .slide-row-content{grid-template-columns:1fr}.rows-view .slide-row-content>.review-slide{position:relative;top:auto}}.review-actions{position:sticky;top:0;background:#f5f7fc;z-index:5;padding:16px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}@media(max-width:600px){.review-grid{grid-template-columns:1fr}}</style></head><body><header><a href="/admin.html">← Authoring studio</a><strong>ultra · Annotation review</strong></header><main><h1 id="title">Review slide annotations</h1><p>Generate AI annotations, review each slide, and adjust position, size, style or timing. Position and size are percentages of the original slide. All edits autosave.</p><div class="review-actions"><div class="view-toggle" role="group" aria-label="Slide listing view"><button id="grid-view" aria-pressed="true">Grid</button><button id="rows-view" aria-pressed="false">Rows</button></div><button id="generate">Generate AI annotations</button><button id="stop" hidden>Stop</button><button id="approve" disabled>Approve & open rehearsal →</button><button id="publish" disabled>Publish to lecture library</button><span id="status" role="status"></span></div><section class="voice-overall"><strong id="generation-summary"></strong><progress id="generation-progress" max="1" value="0" aria-label="Overall annotation generation"></progress><span id="generation-detail" role="status"></span></section><div id="slides" class="review-grid"></div></main><script type="module" src="annotation-review.js"></script></body></html>
