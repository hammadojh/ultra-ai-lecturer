<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Ultra</title><link rel="stylesheet" href="login.css"></head><body><main><a class="brand" href="/">ultra</a><h1>Welcome back</h1><p id="intro">Sign in to your learning space.</p><form id="auth-form"><label id="name-label" hidden>Name<input name="name" autocomplete="name" maxlength="60"></label><label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><p id="hint" hidden>Use at least 12 characters.</p><p id="error" role="alert"></p><button id="submit" type="submit">Sign in</button></form><button id="switch" class="secondary">Create a student account</button><p id="setup-note" hidden>The first account is the administrator. All later registrations are students.</p></main><script type="module" src="login.js"></script></body></html>
